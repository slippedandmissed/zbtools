[ferry-load-and-go]
description = "Zoombinis are put on the ferry; it sets off"
commands = "party 8; scene 10; wait 7000; drag zoombini 0 place 2; wait 1000; drag zoombini 1 place 3; wait 1000; drag zoombini 2 place 4; wait 1000; screenshot loaded; click 618 458; wait 2400; screenshot moving"
seed = 7
# where the boat is mid-crossing depends on timing (up to 11% of the screen differed): the picture
# before it sets off is exact, the moving one is only roughly compared
tolerance = 0.15

[toads-wrong-piece]
description = "A toad is put in a row whose lily pad doesn't match it: it goes back"
commands = "party 8; scene 11; wait 7000; screenshot start; drag 68 119 151 79; wait 1500; screenshot refused; assert padsPlaced 0"

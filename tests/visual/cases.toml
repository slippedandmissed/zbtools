# Visual test cases (`uv run visual`; see the handbook's "Visual tests"): each is a debug-command script that plays
# something and takes pictures with `screenshot NAME`, compared with tests/visual/baselines/<case>/<NAME>.png.
# Every case starts by turning "sticky mouse" off and seeding the game's random numbers (`seed`).

[scenes-camps-and-town]
description = "Shelter Rock, Shade Tree, Zoombiniville, Zoombini Isle and the map, each entered from the last"
commands = "party 16; scene 4; wait 5000; assert scene 4; screenshot camp-1; scene 5; wait 5000; assert scene 5; screenshot camp-2; scene 6; wait 5000; assert scene 6; screenshot town; scene 3; wait 5000; assert scene 3; screenshot isle; scene 1; wait 5000; assert scene 1; screenshot map"

[scenes-group-1]
description = "The three puzzles of group 1 open: Allergic Cliffs, Stone Cold Caves, Pizza Pass"
commands = "party 8; scene 7; wait 5000; assert scene 7; screenshot cliffs; scene 8; wait 5000; assert scene 8; screenshot caves; scene 9; wait 5000; assert scene 9; screenshot pizza"

[scenes-group-2]
description = "The three puzzles of group 2 open: the ferry, the toads, Stone Rise"
commands = "party 8; scene 10; wait 5000; assert scene 10; screenshot ferry; scene 11; wait 5000; assert scene 11; screenshot toads; scene 12; wait 5000; assert scene 12; screenshot stone-rise"

[scenes-group-3]
description = "The three puzzles of group 3 open: Fleens, Hotel Dimensia, Mudball Wall"
commands = "party 8; scene 13; wait 5000; assert scene 13; screenshot fleens; scene 14; wait 5000; assert scene 14; screenshot hotel; scene 15; wait 5000; assert scene 15; screenshot mudball"

[scenes-group-4]
description = "The three puzzles of group 4 open: the Lion's Lair, the Mirror Machine, Bubblewonder Abyss"
commands = "party 8; scene 16; wait 5000; assert scene 16; screenshot lion; scene 17; wait 5000; assert scene 17; screenshot mirror; scene 18; wait 5000; assert scene 18; screenshot bubble"

[scenes-hidden]

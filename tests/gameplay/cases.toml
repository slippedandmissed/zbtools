# Gameplay test cases (`uv run gameplay`; see the handbook's "Instrumented gameplay tests"): each is a debug-command script that plays
# something and takes pictures with `screenshot NAME`, compared with tests/gameplay/baselines/<case>/<NAME>.png.
# Every case starts by turning "sticky mouse" off and seeding the game's random numbers (`seed`).

[open-map]
description = "The map opens: no practice mode, no hotspot picked"
commands = "scene 1; wait 5000; assert scene 1; assert practice 0; assert pickedHotspot 0; screenshot map"

[open-isle]
description = "Zoombini Isle opens with no Zoombinis made or waiting"
commands = "scene 3; wait 5000; assert scene 3; assert enoughToLeaveChosen 0; assert enoughToLeave 16; assert zoombinis 0; screenshot isle"
# the sea's colours cycle and the party idles, so on a busy machine they differ (3-7% of the pixels in a stressed run)
tolerance = 0.10

[open-shelter-rock]
description = "Shelter Rock opens with a party of sixteen: enough to set out"
commands = "party 16; scene 4; wait 5000; assert scene 4; assert zoombinis 16; assert campEnoughChosen 1; assert campCount 0; screenshot camp-1"

[open-shade-tree]
description = "Shade Tree opens with the party in its book"
commands = "party 16; scene 5; wait 5000; assert scene 5; assert zoombinis 16; assert bookCount 0; screenshot camp-2"

[open-zoombiniville]
description = "Zoombiniville opens with the party settled and its buildings' hotspots"
commands = "party 8; scene 6; wait 5000; assert scene 6; assert townPartySize 8; assert recordHotspotCount 6; screenshot town"

[open-allergic-cliffs]
description = "Allergic Cliffs opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 7; wait 5000; assert scene 7; assert bridgeLevel 0; assert bridgeGoReady 0; assert sentBackCount 0; assert zoombinis 8; screenshot cliffs"

[open-stone-cold-caves]
description = "Stone Cold Caves opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 8; wait 5000; assert scene 8; assert tunnelsLevel 0; assert turnBacksLeft 16; assert zoombinis 8; screenshot caves"

[open-pizza-pass]
description = "Pizza Pass opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 9; wait 5000; assert scene 9; assert pizzaLevel 0; assert trollsAtLevel 1; assert pizzasLeft 6; assert pizzaGoReady 0; assert zoombinis 8; screenshot pizza"

[open-ferry]
description = "Captain Cajun's Ferryboat opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 10; wait 5000; assert scene 10; assert ferryLevel 1; assert ferrySnoidCount 8; assert zoombinis 8; screenshot ferry"

[open-toads]
description = "Titanic Tattooed Toads opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 11; wait 5000; assert scene 11; assert lillyLevel 2; assert padsPlaced 0; assert zoombinis 8; screenshot toads"
# a toad hops and the Zoombinis idle (2.2% differed in a stressed run)
tolerance = 0.04
[open-stone-rise]
description = "Stone Rise opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 12; wait 5000; assert scene 12; assert stoneRiseLevel 1; assert slidesGoReady 0; assert zoombinis 8; screenshot stone-rise"

[open-fleens]
description = "Fleens! opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 13; wait 5000; assert scene 13; assert fleensLevel 2; assert fleensGoReady 0; assert zoombinis 8; screenshot fleens"

[open-hotel]
description = "Hotel Dimensia opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 14; wait 5000; assert scene 14; assert hotelLevel 2; assert hotelGoReady 0; assert zoombinis 8; screenshot hotel"

[open-mudball-wall]
description = "Mudball Wall opens with the party of eight at the level its group is at (groups 1-4 at levels 1-4)"
commands = "level 1 1; level 2 2; level 3 3; level 4 4; party 8; scene 15; wait 5000; assert scene 15; assert netLevel 2; assert zoombinis 8; screenshot mudball"

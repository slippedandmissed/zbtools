# --- Allergic Cliffs, played with the `cliffs` oracle (port/debug/oracles.cpp): it reads the cliff's rule from the game
# and sends each Zoombini to the bridge where it is let across (or, deliberately, to the other).

[cliffs-win-level-1]
description = "Allergic Cliffs at group 1's level 1: all sixteen Zoombinis are sent over the right bridges, nobody is turned back, and the go button leaves for Stone Cold Caves with all of them"
commands = "level 1 1; party 16; scene 7; wait 6000; assert bridgeLevel 0; cliffs send right 16; wait until cliffsAcross == 16; wait 3000; assert sentBackCount 0; assert cliffsWaiting 0; assert crossingUnderway 0; screenshot won; click 618 458; wait scene 2; assert journeyFrom 7; assert journeyTo 8; wait scene 8; assert scene 8; assert tunnelsLevel 0; assert zoombinis 16"
seconds = 150
# the Zoombinis settle and fidget on the far side
tolerance = 0.05

[cliffs-win-level-2]
description = "Allergic Cliffs at group 1's level 2: all sixteen Zoombinis are sent over the right bridges, nobody is turned back, and the go button leaves for Stone Cold Caves with all of them"

# --- Transitions: leaving a scene by the player's own click and arriving where the code says. (A puzzle's own
# exits need the puzzle won: they belong to the puzzle's cases.) The intro cases set the saved scene (offset 0xcc of the
# game state) while the logo plays; `scene 0` must not be used there, it opens the intro a second time.

[transition-intro-fresh-game]
description = "The logo is skipped by a click: a new game goes to Zoombini Isle"
commands = "wait 2000; assert scene 0; click 300 300; wait scene 3; assert scene 3; assert zoombinis 0"

[transition-intro-resumes-in-a-puzzle]

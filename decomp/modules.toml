# The source modules (object files) of zoombi32.exe's own code, in link order.
#
# TLINK32 lays each object file's code out contiguously and pads it with zeros
# to a 4-byte boundary, so most module ends show as padding; a module whose
# code is already aligned shows none, so a range here may still hold several
# modules. `uv run modules` checks this map against the padding and prints the
# evidence (strings, imports) for each range. See docs/findings.md.
#
# Each module runs from its start to the next one's. `name` is the file stem
# its code goes in (decomp/<name>.cpp); modules whose purpose isn't clear yet
# are named after their address. `note` gives the evidence for the name.


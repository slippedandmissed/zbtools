[project]
name = "zbtools"
version = "0.1.0"
description = "Tooling for the Logical Journey of the Zoombinis decompilation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0.9",
    "fonttools>=4.66.0",
    "pefile>=2024.8.26",
    "pillow>=12.3.0",
    "pycdlib>=1.21.0",
    "pydantic>=2.13.5",
    "pyghidra>=3.1.0",
    "python-dotenv>=1.2.3",
    "qemu-qmp>=0.0.6",
    "typer>=0.27.2",
]

[project.scripts]
clean = "zbtools.clean:app"
lint = "zbtools.lint:app"
extract-game = "zbtools.extract_game:app"
vm = "zbtools.vm:app"
toolchain = "zbtools.toolchain:app"
match = "zbtools.match:app"
ghidra = "zbtools.ghidra:app"
runtime-symbols = "zbtools.runtime_symbols:app"
classes = "zbtools.rtti:app"
unpack-isz = "zbtools.unpack_isz:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ghidra-stubs==12.1.4",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ANN",      # type annotations everywhere (ANN401 bans explicit Any)
    "PTH",      # pathlib over os.path
    "C4",       # comprehensions
    "PIE", "RET", "PL",
]
ignore = [
    "PLR2004",  # magic numbers: binary formats are full of them
    "PLR0913",  # too many arguments
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
# These ship no type information; keep their objects inside typed wrappers.
module = ["fontTools", "fontTools.*", "pefile", "capstone"]
ignore_missing_imports = true

[project]
name = "zbtools"
version = "0.1.0"
description = "Tooling for the Logical Journey of the Zoombinis decompilation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pycdlib>=1.21.0",
    "pydantic>=2.13.5",
]

[project.scripts]
clean = "zbtools.clean:main"
lint = "zbtools.lint:main"
extract-game = "zbtools.extract_game:main"
vm = "zbtools.vm:main"
unpack-isz = "zbtools.unpack_isz:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ANN",      # type annotations everywhere (ANN401 bans explicit Any)
    "PTH",      # pathlib over os.path
    "C4",       # comprehensions
    "PIE", "RET", "PL",
]
ignore = [
    "PLR2004",  # magic numbers: binary formats are full of them
    "PLR0913",  # too many arguments
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

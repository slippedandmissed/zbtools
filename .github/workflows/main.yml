name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

# Both jobs need the game CD (and the report the Borland C++ 4.5 CD, Ghidra and
# a JDK), which are bring-your-own and never in the repository, so they run on
# a self-hosted runner with them in data/ (plus 7-Zip, Wine and JDK 21), and
# only once the repository variable GAME_DATA_RUNNER is set to "true".
jobs:
  report:
    if: vars.GAME_DATA_RUNNER == 'true'
    runs-on: [self-hosted, zbtools-data]
    steps:
      - uses: actions/checkout@v4
      - name: Bring-your-own files
        run: ln -sfn "$ZBTOOLS_DATA" data
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run extract-game
      - run: uv run toolchain setup
      - run: uv run ghidra setup
      - run: uv run runtime-symbols
      - run: uv run classes
      - run: uv run report
      # The report contains the game's disassembly: anyone who can read this
      # repository's Actions artifacts can download it, so keep the repository
      # private (or drop this step and read the report on the runner).
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: build/report/
          retention-days: 14

  deploy:
    if: vars.GAME_DATA_RUNNER == 'true'
    runs-on: [self-hosted, zbtools-data]
    steps:
      - uses: actions/checkout@v4
      - name: Bring-your-own files
        run: ln -sfn "$ZBTOOLS_DATA" data
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run extract-game
      - run: uv run port setup
      - run: uv run port build web
      # build/port/site/: the page and the game's data, every file under
      # Cloudflare Pages' 25 MiB limit.
      - run: uv run port package
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/port/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

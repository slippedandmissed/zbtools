name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

# The deployment and the release need only the repository (the game's resources
# are in assets/); the progress report also needs the bring-your-own files, which
# the game-data action fetches from a private bucket.
jobs:
  # The progress report, without the original's disassembly (--no-embed-binary), so
  # that its artifact, which anyone signed in to GitHub can download from this public
  # repository, holds nothing of the game's code.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/game-data
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run extract-game
      - run: uv run toolchain setup
      - run: uv run ghidra setup
      - run: uv run runtime-symbols
      - run: uv run classes
      - run: uv run report --no-embed-binary
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: build/report/
          retention-days: 14

  # Every target, built once (package.yml): the web page is deployed and the
  # packages for players are released from its artifacts.
  package:
    uses: ./.github/workflows/package.yml

  deploy-web-port:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-browser_wasm
          path: site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

  # A release with a package for every player target (macOS, Windows x86 and x64,
  # Linux x64 and arm64), numbered by this workflow's run. The web page and the
  # headless build are not released: one is deployed above, the other is for testing.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: zoombinis-*
          merge-multiple: true
          path: packages
      - name: Create the release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          ls -l packages
          gh release create "$tag" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --generate-notes

  # The handbook (docs/), built with mdBook into build/book/ (see docs/book.toml).
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/book --project-name=${{ vars.CLOUDFLARE_DOCS_PAGES_PROJECT }} --branch=main

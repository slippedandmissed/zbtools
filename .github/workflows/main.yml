name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

# The progress report job is disabled (commented out below) until two problems
# are solved:
#
# - It needs the gitignored bring-your-own files (the game CD and the Borland
#   C++ 4.5 CD in data/, plus Ghidra, a JDK, 7-Zip and Wine), which GitHub's
#   runners don't have and the repository can't hold. The version below ran on
#   a self-hosted runner that did.
# - The report contains the game's disassembly, and this repository is public:
#   anyone signed in to GitHub can download its Actions artifacts. Modify the
#   report so it doesn't include the game's disassembly before enabling the
#   upload step.
#
# The deployment and the release need only the repository (the game's resources
# are in assets/).
jobs:
  # report:
  #   if: vars.GAME_DATA_RUNNER == 'true'
  #   runs-on: [self-hosted, zbtools-data]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Bring-your-own files
  #       run: ln -sfn "$ZBTOOLS_DATA" data
  #     - uses: astral-sh/setup-uv@v6
  #     - run: uv sync --locked
  #     - run: uv run extract-game
  #     - run: uv run toolchain setup
  #     - run: uv run ghidra setup
  #     - run: uv run runtime-symbols
  #     - run: uv run classes
  #     - run: uv run report
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: report
  #         path: build/report/
  #         retention-days: 14

  # Every target, built once (package.yml): the web page is deployed and the
  # packages for players are released from its artifacts.
  package:
    uses: ./.github/workflows/package.yml

  deploy:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-browser_wasm
          path: site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

  # A release with a package for every player target (macOS, Windows x86 and x64,
  # Linux x64 and arm64), numbered by this workflow's run. The web page and the
  # headless build are not released: one is deployed above, the other is for testing.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: zoombinis-*
          merge-multiple: true
          path: packages
      - name: Create the release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          ls -l packages
          gh release create "$tag" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --generate-notes

  # The handbook (docs/), built with mdBook into build/book/ (see docs/book.toml).
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/book --project-name=${{ vars.CLOUDFLARE_DOCS_PAGES_PROJECT }} --branch=main

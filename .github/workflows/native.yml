name: Native

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The macOS application (universal: Apple silicon and Intel), signed ad hoc.
  # Needs only the source: the game's data is in assets/.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run port package macos_universal
      - uses: actions/upload-artifact@v4
        with:
          name: zoombinis-macos
          path: build/port/dist/*.dmg
          retention-days: 14

  # Windows and Linux packages, cross-built on a Linux runner: llvm-mingw for
  # Windows, a container for Linux (arm64 runs under emulation, which is slow).
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows_x86, windows_x64, linux_x64]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run port package ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: zoombinis-${{ matrix.target }}
          path: |
            build/port/dist/*.zip
            build/port/dist/*.tar.gz
          retention-days: 14

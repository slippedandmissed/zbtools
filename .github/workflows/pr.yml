name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ruff lint, ruff format, mypy, pytest: needs none of the bring-your-own files.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run lint

  # The decompiled game compiles for WebAssembly. Needs only the source, not the game.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: build/emsdk
          # The SDK version is pinned in port.py.
          key: emsdk-${{ hashFiles('src/zbtools/port.py') }}
      - run: uv run port setup
      - run: uv run port build web

  # Every function recorded in decomp/matching.txt still matches the original
  # byte for byte, and the game's data still matches. This needs the game CD
  # and the Borland C++ 4.5 CD (bring-your-own, never in the repository), so it
  # runs on a self-hosted runner that has them in data/ (plus 7-Zip and Wine),
  # and only once the repository variable GAME_DATA_RUNNER is set to "true".
  regressions:
    if: vars.GAME_DATA_RUNNER == 'true'
    runs-on: [self-hosted, zbtools-data]
    steps:
      - uses: actions/checkout@v4
      - name: Bring-your-own files
        run: |
          # data/ is gitignored, so it lives on the runner, beside the checkout.
          ln -sfn "$ZBTOOLS_DATA" data
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run extract-game
      - run: uv run toolchain setup
      - run: uv run match
      - run: uv run match-data -q

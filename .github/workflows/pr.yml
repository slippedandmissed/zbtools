name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ruff lint, ruff format, mypy, pytest: needs none of the bring-your-own files.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run lint

  # The handbook builds, its links resolve and its screenshot index is current
  # (the last two are in `uv run lint`'s tests; this job renders it).
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: mdbook build docs

  # Every target builds and packages (package.yml): macOS, Windows (x86, x64), Linux
  # (x64, arm64), the web page, and the headless test build. Needs only the source.
  package:
    uses: ./.github/workflows/package.yml

  # Visual regression tests (`uv run visual`, handbook: "Visual tests"): the headless
  # port plays the scripted flows in tests/visual/cases.toml and its screenshots are
  # compared with the baselines checked in beside them. Needs only the source. The
  # run's page shows a summary of the failures; the report (one HTML file with the
  # baseline, new picture and differences of each) is its artifact, visual-report.html.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: build/emsdk
          # The SDK version is pinned in port.py.
          key: emsdk-${{ hashFiles('src/zbtools/port.py') }}
      - run: uv run port setup headless_wasm
      - run: uv run port build headless_wasm
      - name: Play the cases and compare their pictures
        run: uv run visual --summary "$GITHUB_STEP_SUMMARY"
      # The artifact is named after its file (archive: false), and not zipped: download it and open it.
      - name: Name the report
        if: always()
        run: |
          if [ -f build/visual/report.html ]; then cp build/visual/report.html visual-report.html; fi
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('visual-report.html') != ''
        with:
          path: visual-report.html
          archive: false
          retention-days: 14
      # The failing pictures themselves (the new one, and baseline | new | differences).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-pictures
          path: build/visual/
          if-no-files-found: ignore
          retention-days: 14

  # Every function recorded in decomp/matching.txt still matches the original
  # byte for byte, and the game's data still matches. This needs the game CD
  # and the Borland C++ 4.5 CD (bring-your-own, never in the repository): the
  # game-data action fetches them from a private bucket with Workload Identity
  # Federation, which GitHub doesn't offer pull requests from forks, so for those
  # the job is skipped (a maintainer can push the branch to this repository).
  regressions:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/game-data
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run extract-game
      - run: uv run toolchain setup
      - name: DEBUG toolchain failure
        if: failure()
        run: |
          set +e
          uv run python - <<'PY'
          import os, subprocess
          from zbtools import host, paths, toolchain

          wd = paths.TOOLCHAIN_DIR / "check" / "4.5"
          exe = str(toolchain.root_dir("4.5") / "BIN" / "BCC32.EXE")
          wine = str(host.wine_bin_dir() / "wine")

          def attempt(label: str, env: dict[str, str]) -> bool:
              (wd / "HELLO.EXE").unlink(missing_ok=True)
              r = subprocess.run([wine, exe, "-WC", "hello.c"], cwd=wd, env=env, capture_output=True, text=True)
              ok = (wd / "HELLO.EXE").exists()
              print(f"{label}: {'OK' if ok else 'FAILED'} rc={r.returncode}", flush=True)
              return ok

          full = toolchain._wine_env(r"T:\BC45\BIN")
          print("env keys:", sorted(full), flush=True)
          minimal = {k: v for k, v in full.items() if k.startswith("WINE") or k in ("PATH", "HOME", "LANG")}
          attempt("minimal env", minimal)
          attempt("full env", full)
          for key in sorted(set(full) - set(minimal)):
              trimmed = {k: v for k, v in full.items() if k != key}
              if attempt(f"full env without {key}", trimmed):
                  print("  -> removing", key, "makes it pass:", repr(full[key])[:200], flush=True)
          PY
      - run: uv run match
      - run: uv run match-data -q

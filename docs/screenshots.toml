# Recipes for `uv run shots` (src/zbtools/shots.py): for each screenshot placeholder, the
# debug commands (handbook, "Debug tools") that take the headless port to the moment; `quit`
# ends the run and the last frame is the picture. `seconds` is a safety limit, `crop` the part
# of the 640x480 screen to keep.
#
# Handy: `party N` makes a party that sets out; `scene N` goes to a scene (`scene N map` by the
# journey scene); the screen's buttons are at x 618 (map y 415, go y 458); a drag is
# `click X Y press; wait 300; click X2 Y2 move; wait 250; click X2 Y2 release`.


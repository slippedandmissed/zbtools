# Toads: a piece (a toad at the left) goes into a row whose left lily pad has the same
# attribute value. `toads` lists the pieces (position, attribute, value) and the rows (entry
# point, attributes) for the seed; these eight were matched by hand from it. Then "go", and a
# Zoombini rides a toad across the pads.
